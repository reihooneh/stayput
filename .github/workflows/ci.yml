name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the C toolchain, the pinned packages and the test browser
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld clang-tidy
          npm ci
          npx playwright install --with-deps chromium
      - name: C core under AddressSanitizer and UBSan (physics against theory, random inputs)
        run: make test-core
      - name: C lint (strict warnings and clang-tidy)
        run: make lint
      - name: Rebuild the WebAssembly and the site, and check the committed pages match
        run: |
          npm run build
          git diff --exit-code -- site ':!site/assets/stayput.wasm'
      - name: Room model and WebAssembly interface tests
        run: npm test
      - name: Browser tests at phone, tablet and desktop sizes
        run: npm run test:web
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish only the built site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
